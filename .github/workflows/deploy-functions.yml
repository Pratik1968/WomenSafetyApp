name: Deploy Edge Functions

# Auto-deploys Supabase Edge Functions whenever a backend service changes.
# Creates new functions and updates existing ones — no manual step.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'supabase/config.toml'
      - 'deployment/deploy-functions.sh'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: bash deployment/deploy-functions.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
