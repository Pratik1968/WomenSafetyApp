events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream Microservice Definitions
    upstream notification_service {
        server notification-service:8000;
    }

    upstream emergency_service {
        server emergency-service:8001;
    }

    upstream ai_service {
        server ai-service:8002;
    }

    upstream user_service {
        server user-service:8003;
    }

    upstream gps_service {
        server gps-service:8004;
    }

    server {
        listen 80;
        server_name _;

        # Global CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. Gateway Health Check
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","services":["notification","emergency","ai","user","gps"]}';
        }

        # 2. Notification Service Routes (Devices & Notifications)
        location /api/v1/devices {
            proxy_pass http://notification_service/api/v1/devices;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/notifications {
            proxy_pass http://notification_service/api/v1/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Emergency Service Routes
        location /api/v1/emergency {
            proxy_pass http://emergency_service/api/v1/emergency;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. AI Service Routes
        location /api/v1/ai {
            proxy_pass http://ai_service/api/v1/ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. User & Auth Service Routes
        location /api/v1/users {
            proxy_pass http://user_service/api/v1/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. GPS Service Routes
        location /api/v1/gps {
            proxy_pass http://gps_service/api/v1/gps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
